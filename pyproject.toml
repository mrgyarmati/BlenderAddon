[project]
name = "blender-unreal-bridge"
version = "0.1.0"
description = "Blender 5.2 extension for validated FBX export and import scripts for Unreal Engine 5.6+"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
readme = "README.md"

# The add-on ships no runtime dependencies (Blender's bundled Python only).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Unit tests are unittest.TestCase classes: `python -m unittest discover -s tests/unit -t .`
# runs them without pytest; pytest discovers the same files.
testpaths = ["tests/unit"]
pythonpath = ["addon", "."]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["build", "dist"]
